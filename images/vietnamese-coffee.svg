    <!-- Condensed Milk Bottom Layer -->
    <path d="M249 375 L247 330 Q300 335 353 330 L351 375 C348 382 340 386 300 386 C260 386 252 382 249 375 Z" fill="#FDF3CE"/>
    <!-- Dark Robusta Layer -->
