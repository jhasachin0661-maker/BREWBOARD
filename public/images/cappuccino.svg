    <path d="M300 238 C280 220 260 210 275 195 C290 185 300 205 300 205 C300 205 310 185 325 195 C340 210 320 220 300 238 Z" fill="#B3784C"/>
    <ellipse cx="300" cy="215" rx="14" ry="10" fill="#FFFBF5"/>
